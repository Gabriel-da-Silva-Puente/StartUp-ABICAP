<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PonteEscola — Mensagens</title>

    <link rel="stylesheet" href="../components/global.css">
    <link rel="stylesheet" href="../components/layout.css">
    <link rel="stylesheet" href="../components/components.css">
    <link rel="stylesheet" href="../styles/administrador-mensagens.css">
</head>

<body>

<div class="estrutura-app">

    <aside class="barra-lateral"></aside>

    <main class="conteudo-principal">

        <header class="barra-topo"></header>

        <section class="conteudo-pagina">

            <div class="cabecalho-pagina">
                <div>
                    <h2>Mensagens</h2>
                    <p id="subtitulo-mensagens" class="subtitulo-pagina">
                        Conversas com os pais e responsáveis
                    </p>
                </div>

                <button id="btn-nova-mensagem" class="btn-principal" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"/><path d="M12 5v14"/>
                    </svg>
                    Nova Mensagem
                </button>
            </div>

            <div class="filtros-mensagens" id="filtros-mensagens">
                <button type="button" data-filtro="todas" aria-pressed="true">Todas</button>
                <button type="button" data-filtro="nao-respondidas" aria-pressed="false">Não Respondidas</button>
                <button type="button" data-filtro="respondidas" aria-pressed="false">Respondidas</button>
            </div>

            <div class="mensagens-layout">

                <div class="mensagens-lista" id="mensagens-lista"></div>

                <div class="mensagem-detalhe" id="mensagem-detalhe">
                    <div class="detalhe-vazio">
                        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#CCC" stroke-width="1"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <p>Selecione uma mensagem para ler</p>
                    </div>
                </div>

            </div>

        </section>

    </main>

</div>

<dialog id="modal-mensagem" class="modal">
    <form id="form-mensagem" class="modal-form">
        <div class="modal-cabecalho">
            <h3>Nova Mensagem</h3>
            <button type="button" class="modal-fechar" id="btn-fechar-modal" aria-label="Fechar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <label>
            Turma do aluno
            <select id="modal-turma" required>
                <option value="">Selecione a turma...</option>
            </select>
        </label>

        <label>
            Aluno (Responsável)
            <select id="modal-aluno" required disabled>
                <option value="">Selecione a turma primeiro...</option>
            </select>
        </label>

        <label>
            Assunto
            <input type="text" id="assunto" required maxlength="100" placeholder="Ex: Sobre a reunião de pais">
        </label>

        <label>
            Mensagem
            <textarea id="mensagem" required rows="5" maxlength="500" placeholder="Escreva sua mensagem..."></textarea>
        </label>

        <div class="modal-acoes">
            <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar</button>
            <button type="submit" class="btn-principal">Enviar</button>
        </div>
    </form>
</dialog>

<div class="aviso-flutuante" id="aviso-flutuante"></div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../services/supabase.js"></script>

<!-- Services -->
<script src="../services/administradorService.js"></script>
<script src="../services/mensagensService.js"></script>

<!-- Componentes -->
<script src="../components/administrador-sidebar.js"></script>
<script src="../components/administrador-topbar.js"></script>

<!-- Scripts -->
<script src="../scripts/mensagensAdmin.js"></script>

<script>
    renderizarBarraLateralAdministrador("administrador-mensagens", "../");
    renderizarBarraTopoAdministrador("../");
</script>

</body>
</html>
