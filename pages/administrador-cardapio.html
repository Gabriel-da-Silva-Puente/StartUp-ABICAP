<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PonteEscola — Cardápio</title>

    <link rel="stylesheet" href="../components/global.css">
    <link rel="stylesheet" href="../components/layout.css">
    <link rel="stylesheet" href="../components/components.css">
    <link rel="stylesheet" href="../styles/administrador-cardapio.css">
</head>

<body>

<div class="estrutura-app">

    <aside class="barra-lateral"></aside>

    <main class="conteudo-principal">

        <header class="barra-topo"></header>

        <section class="conteudo-pagina">

            <div class="cabecalho-pagina">
                <div>
                    <h2>Cardápio da Merenda</h2>
                    <p id="subtitulo-cardapio" class="subtitulo-pagina">
                        Semana de 14/10 a 18/10
                    </p>
                </div>

                <div class="cabecalho-acoes" style="display:flex;gap:.5rem;align-items:center">
                <button id="btn-semana-anterior" class="btn-secundario" type="button" aria-label="Semana anterior">&lsaquo;</button>
                <button id="btn-semana-proxima" class="btn-secundario" type="button" aria-label="Próxima semana">&rsaquo;</button>
                <button id="btn-editar-cardapio" class="btn-principal" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                    </svg>
                    Editar Cardápio
                </button>
                </div>
            </div>

            <div class="cardapio-semana" id="cardapio-semana"></div>

        </section>

    </main>

</div>

<dialog id="modal-cardapio" class="modal">
    <form id="form-cardapio" class="modal-form">

        <h3>Editar Cardápio</h3>

        <label>
            Semana (data de início)
            <input type="date" id="semana-inicio" required>
        </label>

        <fieldset class="campo-dia">
            <legend>Segunda-feira</legend>
            <label>
                Café da manhã
                <input type="text" id="seg-cafe" maxlength="100">
            </label>
            <label>
                Almoço
                <input type="text" id="seg-almoco" maxlength="100">
            </label>
            <label>
                Lanche da tarde
                <input type="text" id="seg-lanche" maxlength="100">
            </label>
        </fieldset>

        <fieldset class="campo-dia">
            <legend>Terça-feira</legend>
            <label>
                Café da manhã
                <input type="text" id="ter-cafe" maxlength="100">
            </label>
            <label>
                Almoço
                <input type="text" id="ter-almoco" maxlength="100">
            </label>
            <label>
                Lanche da tarde
                <input type="text" id="ter-lanche" maxlength="100">
            </label>
        </fieldset>

        <fieldset class="campo-dia">
            <legend>Quarta-feira</legend>
            <label>
                Café da manhã
                <input type="text" id="qua-cafe" maxlength="100">
            </label>
            <label>
                Almoço
                <input type="text" id="qua-almoco" maxlength="100">
            </label>
            <label>
                Lanche da tarde
                <input type="text" id="qua-lanche" maxlength="100">
            </label>
        </fieldset>

        <fieldset class="campo-dia">
            <legend>Quinta-feira</legend>
            <label>
                Café da manhã
                <input type="text" id="qui-cafe" maxlength="100">
            </label>
            <label>
                Almoço
                <input type="text" id="qui-almoco" maxlength="100">
            </label>
            <label>
                Lanche da tarde
                <input type="text" id="qui-lanche" maxlength="100">
            </label>
        </fieldset>

        <fieldset class="campo-dia">
            <legend>Sexta-feira</legend>
            <label>
                Café da manhã
                <input type="text" id="sex-cafe" maxlength="100">
            </label>
            <label>
                Almoço
                <input type="text" id="sex-almoco" maxlength="100">
            </label>
            <label>
                Lanche da tarde
                <input type="text" id="sex-lanche" maxlength="100">
            </label>
        </fieldset>

        <div class="modal-acoes">
            <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar</button>
            <button type="submit" class="btn-principal">Salvar Cardápio</button>
        </div>

    </form>
</dialog>

<div class="aviso-flutuante" id="aviso-flutuante"></div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../services/supabase.js"></script>

<!-- Services -->
<script src="../services/administradorService.js"></script>
<script src="../services/cardapioService.js"></script>

<!-- Componentes do Admin -->
<script src="../components/utilitarios.js"></script>
<script src="../components/administrador-sidebar.js"></script>
<script src="../components/administrador-topbar.js"></script>

<!-- Script da Página -->
<script src="../scripts/administrador-cardapio.js"></script>

<script>
    renderizarBarraLateralAdministrador("administrador-cardapio", "../");
    renderizarBarraTopoAdministrador("../");
</script>

</body>

</html>
