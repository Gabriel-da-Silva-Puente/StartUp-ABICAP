<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PonteEscola — Turmas</title>

    <link rel="stylesheet" href="../components/global.css">
    <link rel="stylesheet" href="../components/layout.css">
    <link rel="stylesheet" href="../components/components.css">
    <link rel="stylesheet" href="../styles/administrador-turmas.css">
</head>

<body>

<div class="estrutura-app">

    <aside class="barra-lateral"></aside>

    <main class="conteudo-principal">

        <header class="barra-topo"></header>

        <section class="conteudo-pagina">

            <div class="cabecalho-pagina">
                <div>
                    <h2>Turmas</h2>
                    <p id="subtitulo-turmas" class="subtitulo-pagina">
                        Todas as turmas da escola
                    </p>
                </div>
                <button id="btn-nova-turma" class="btn-principal" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"/><path d="M12 5v14"/>
                    </svg>
                    Nova Turma
                </button>
            </div>

            <div class="barra-ferramentas">
                <div class="campo-pesquisa">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.3-4.3"/>
                    </svg>
                    <input type="search" id="busca-turmas" placeholder="Buscar turma..." aria-label="Buscar turma">
                </div>

                <div class="filtros-turmas" id="filtros-turmas">
                    <button type="button" data-filtro="todas" aria-pressed="true">Todas</button>
                    <button type="button" data-filtro="infantil" aria-pressed="false">Educação Infantil</button>
                    <button type="button" data-filtro="fundamental" aria-pressed="false">Fundamental</button>
                </div>
            </div>

            <div class="lista-turmas" id="lista-turmas"></div>

        </section>

    </main>

</div>

<div class="aviso-flutuante" id="aviso-flutuante"></div>

<script src="../components/administrador-sidebar.js"></script>
<script src="../components/administrador-topbar.js"></script>
<script>
    renderizarBarraLateralAdministrador("administrador-turmas", "../");
    renderizarBarraTopoAdministrador("../");
</script>

</body>

</html>
