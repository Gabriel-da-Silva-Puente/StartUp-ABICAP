<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PonteEscola — Turmas</title>

    <link rel="stylesheet" href="../components/global.css">
    <link rel="stylesheet" href="../components/layout.css">
    <link rel="stylesheet" href="../components/components.css">
    <link rel="stylesheet" href="../styles/administrador-turmas.css">
</head>

<body>

<div class="estrutura-app">

    <aside class="barra-lateral"></aside>

    <main class="conteudo-principal">

        <header class="barra-topo"></header>

        <section class="conteudo-pagina">

            <div class="cabecalho-pagina">
                <div>
                    <h2>Turmas</h2>
                    <p id="subtitulo-turmas" class="subtitulo-pagina">
                        Todas as turmas da escola
                    </p>
                </div>
                <button id="btn-nova-turma" class="btn-principal" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"/><path d="M12 5v14"/>
                    </svg>
                    Nova Turma
                </button>
            </div>

            <div class="barra-ferramentas">
                <div class="campo-pesquisa">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.3-4.3"/>
                    </svg>
                    <input type="search" id="busca-turmas" placeholder="Buscar turma..." aria-label="Buscar turma">
                </div>

                <div class="filtros-turmas" id="filtros-turmas">
                    <button type="button" data-filtro="todas" aria-pressed="true">Todas</button>
                    <button type="button" data-filtro="infantil" aria-pressed="false">Educação Infantil</button>
                    <button type="button" data-filtro="fundamental" aria-pressed="false">Fundamental</button>
                </div>
            </div>

            <div class="lista-turmas" id="lista-turmas"></div>

        </section>

    </main>

</div>

<!-- MODAL DE CRIAR / EDITAR TURMA -->
<dialog id="modal-turma" class="modal">
    <form id="form-turma" class="modal-form">
        <div class="modal-cabecalho">
            <h3 id="modal-turma-titulo">Nova Turma</h3>
            <button type="button" class="modal-fechar" id="btn-fechar-modal" aria-label="Fechar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="campo-grupo">
            <label for="turma-nome">Nome da Turma</label>
            <input type="text" id="turma-nome" required maxlength="50" placeholder="Ex: Jardim II — Turma A">
        </div>

        <!-- NOVOS CAMPOS DO BANCO -->
        <div class="linha-dupla">
            <div class="campo-grupo">
                <label for="turma-ano">Ano Letivo</label>
                <input type="text" id="turma-ano" maxlength="10" placeholder="Ex: 2026">
            </div>
            <div class="campo-grupo">
                <label for="turma-turno">Turno</label>
                <select id="turma-turno">
                    <option value="">Selecione</option>
                    <option value="Manhã">Manhã</option>
                    <option value="Tarde">Tarde</option>
                    <option value="Noite">Noite</option>
                    <option value="Integral">Integral</option>
                </select>
            </div>
        </div>

        <div class="campo-grupo" style="flex-direction: row; align-items: center; gap: 0.5rem; margin-top: 0.5rem; margin-bottom: 1rem;">
            <input type="checkbox" id="turma-infantil" style="width: 18px; height: 18px; cursor: pointer;">
            <label for="turma-infantil" style="margin-bottom: 0; cursor: pointer;">É turma de Educação Infantil?</label>
        </div>

        <div class="modal-acoes">
            <button type="button" class="btn-secundario" id="btn-cancelar-turma">Cancelar</button>
            <button type="submit" class="btn-principal">Salvar Turma</button>
        </div>
    </form>
</dialog>

<div class="aviso-flutuante" id="aviso-flutuante"></div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Arquivo que cria busca para o supabase 'banco' -->
<script src="../services/supabase.js"></script>

<!-- Services -->
<script src="../services/administradorService.js"></script>
<script src="../services/turmasService.js"></script>

<!-- Componentes (ADMIN) -->
<script src="../components/administrador-sidebar.js"></script>
<script src="../components/administrador-topbar.js"></script>

<!-- Scripts da Página -->
<script src="../scripts/turmasAdmin.js"></script>

<!-- Inicialização da página -->
<script>
    renderizarBarraLateralAdministrador("administrador-turmas", "../");
    renderizarBarraTopoAdministrador("../");
</script>

</body>
</html>
