<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PonteEscola — Ocorrências</title>

    <link rel="stylesheet" href="../components/global.css">
    <link rel="stylesheet" href="../components/layout.css">
    <link rel="stylesheet" href="../components/components.css">
    <link rel="stylesheet" href="/styles/ocorrencias.css">
</head>

<body>

<div class="estrutura-app">

    <aside class="barra-lateral"></aside>

    <main class="conteudo-principal">

        <header class="barra-topo"></header>

        <section class="conteudo-pagina">

            <div class="cabecalho-pagina">
                <div>
                    <h2>Ocorrências</h2>
                    <p id="subtitulo-ocorrencias-data" class="subtitulo-pagina">
                        0 registros · Jardim II — Turma A
                    </p>
                </div>

                <button id="btn-adicionar-ocorrencia" class="btn-principal btn-perigo" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"/><path d="M12 5v14"/>
                    </svg>
                    Adicionar Ocorrência
                </button>
            </div>

            <!-- ÁREA DE OCORRÊNCIAS -->
            <section class="grade-ocorrencias">

                <div class="barra-ferramentas">

                    <div class="campo-pesquisa">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.3-4.3"/>
                        </svg>
                        <input type="search" id="busca-ocorrencias" placeholder="Buscar por aluno..." aria-label="Buscar ocorrências">
                    </div>

                    <div class="filtros-ocorrencias" id="filtros-ocorrencias">
                        <button type="button" data-filtro="todos" aria-pressed="true">Todos</button>
                        <button type="button" data-filtro="comportamental" aria-pressed="false">Comportamental</button>
                        <button type="button" data-filtro="saude" aria-pressed="false">Saúde</button>
                        <button type="button" data-filtro="acidente" aria-pressed="false">Acidente</button>
                        <button type="button" data-filtro="alimentacao" aria-pressed="false">Alimentação</button>
                        <button type="button" data-filtro="outro" aria-pressed="false">Outro</button>
                    </div>

                </div>

                <div class="lista-ocorrencias" id="lista-ocorrencias"></div>

            </section>

        </section>

    </main>

</div>

<div class="aviso-flutuante" id="aviso-flutuante"></div>


<script src="../components/sidebar.js"></script>
<script src="../components/topbar.js"></script>
<script>
    renderizarBarraLateral("ocorrencias", "../");
    renderizarBarraTopo("../");
</script>

</body>

</html>
