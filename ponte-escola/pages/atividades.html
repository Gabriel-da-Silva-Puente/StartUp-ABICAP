<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PonteEscola - Atividades</title>

    <link rel="stylesheet" href="../components/global.css">
    <link rel="stylesheet" href="../components/layout.css">
    <link rel="stylesheet" href="../components/atividades.css">
</head>


<body>

<div class="app-shell">


    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-mark">
                PE
            </div>

            <span>
                PonteEscola
            </span>

        </div>


        <nav class="main-nav">

            <button
                class="nav-item"
                id="btn-nav-inicio"
                type="button"
            >

                <span class="nav-icon">
                    ▦
                </span>

                <span>
                    Início
                </span>

            </button>


            <button
                class="nav-item active"
                id="btn-nav-atividades"
                type="button"
            >

                <span class="nav-icon">
                    ☑
                </span>

                <span>
                    Atividades
                </span>

            </button>


            <button
                class="nav-item"
                id="btn-nav-avisos"
                type="button"
            >

                <span class="nav-icon">
                    ➤
                </span>

                <span>
                    Avisos
                </span>

            </button>


            <button
                class="nav-item"
                id="btn-nav-ocorrencias"
                type="button"
            >

                <span class="nav-icon">
                    △
                </span>

                <span>
                    Ocorrências
                </span>

            </button>


            <button
                class="nav-item"
                id="btn-nav-autorizacoes"
                type="button"
            >

                <span class="nav-icon">
                    ☑
                </span>

                <span>
                    Autorizações
                </span>

            </button>


            <button
                class="nav-item"
                id="btn-nav-mural"
                type="button"
            >

                <span class="nav-icon">
                    ▣
                </span>

                <span>
                    Mural da Turma
                </span>

            </button>

        </nav>


        <div class="sidebar-bottom">

            <button
                class="nav-item"
                id="btn-nav-perfil"
                type="button"
            >

                <span class="nav-icon">
                    ♙
                </span>

                <span>
                    Perfil
                </span>

            </button>


            <button
                class="nav-item"
                id="btn-nav-sair"
                type="button"
            >

                <span class="nav-icon">
                    ↪
                </span>

                <span>
                    Sair
                </span>

            </button>

        </div>

    </aside>



    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main class="main-content">


        <!-- TOPBAR -->

        <header class="topbar">

            <div class="teacher-name">
                Ana Carolina Mendes
            </div>


            <div class="topbar-actions">

                <button
                    class="class-selector"
                    type="button"
                    id="btn-class-selector"
                >

                    <span class="status-dot"></span>

                    <span id="class-label">
                        Jardim II — Turma A
                    </span>

                    <span class="chevron">
                       ⌄
                    </span>

                </button>


                <button
                    class="notification-btn"
                    type="button"
                >

                    ♧

                    <span class="notification-badge">
                        2
                    </span>

                </button>


                <button
                    class="avatar"
                    type="button"
                >
                    AC
                </button>

            </div>

        </header>



        <!-- MENU TURMAS -->

        <div
            class="class-menu"
            id="class-menu"
            hidden
        >

            <button
                type="button"
                data-class="Jardim II — Turma A"
            >
                Jardim II — Turma A
            </button>

            <button
                type="button"
                data-class="Jardim II — Turma B"
            >
                Jardim II — Turma B
            </button>

            <button
                type="button"
                data-class="Jardim I — Turma A"
            >
                Jardim I — Turma A
            </button>

        </div>



        <!-- PÁGINA -->

        <section class="page">


            <div class="activity-page-header">

                <div>

                    <h1>
                        Atividades
                    </h1>

                    <p>
                        <span id="activity-count">
                            5
                        </span>

                        atividades · Jardim II — Turma A
                    </p>

                </div>


                <button
                    class="btn-primary"
                    id="btn-nova-atividade"
                    type="button"
                >

                    <span>
                        +
                    </span>

                    Nova Atividade

                </button>

            </div>



            <!-- ESTATÍSTICAS -->

            <section class="stats-grid">


                <article class="stat-card">

                    <div class="stat-icon stat-icon-green">
                        ✓
                    </div>

                    <div>

                        <strong id="stat-total">
                            5
                        </strong>

                        <span>
                            Total enviadas
                        </span>

                    </div>

                </article>


                <article class="stat-card">

                    <div class="stat-icon stat-icon-orange">
                        ◷
                    </div>

                    <div>

                        <strong id="stat-pending">
                            4
                        </strong>

                        <span>
                            Aguardando leitura
                        </span>

                    </div>

                </article>


                <article class="stat-card">

                    <div class="stat-icon stat-icon-blue">
                        ✓
                    </div>

                    <div>

                        <strong id="stat-confirmed">
                            1
                        </strong>

                        <span>
                            Confirmadas
                        </span>

                    </div>

                </article>


            </section>



            <!-- BUSCA -->

            <div class="filter-area">

                <div class="search-box">

                    <span>
                        ⌕
                    </span>

                    <input
                        type="search"
                        id="input-busca-atividade"
                        placeholder="Buscar atividade..."
                    >

                </div>


                <select
                    id="select-status-atividade"
                >

                    <option value="todos">
                        Todas
                    </option>

                    <option value="aberta">
                        Em andamento
                    </option>

                    <option value="encerrada">
                        Prazo encerrado
                    </option>

                </select>

            </div>



            <!-- LISTA -->

            <section
                class="activity-list"
                id="activity-list"
            >
            </section>


        </section>

    </main>

</div>



<!-- =========================
     MODAL NOVA ATIVIDADE
========================== -->

<div
    class="modal-backdrop"
    id="modal-nova-atividade"
    hidden
>

    <div class="modal">

        <button
            class="modal-close"
            id="btn-fechar-nova-atividade"
            type="button"
        >
            ×
        </button>


        <h2>
            Nova atividade
        </h2>


        <form
            id="form-nova-atividade"
        >


            <div class="form-group">

                <label for="input-titulo-atividade">
                    Título
                </label>

                <input
                    type="text"
                    id="input-titulo-atividade"
                    placeholder="Ex.: Leitura em casa"
                    required
                >

            </div>


            <div class="form-group">

                <label for="input-descricao-atividade">
                    Descrição
                </label>

                <textarea
                    id="input-descricao-atividade"
                    placeholder="Digite as orientações da atividade..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="input-prazo-atividade">
                    Prazo
                </label>

                <input
                    type="date"
                    id="input-prazo-atividade"
                    required
                >

            </div>


            <div class="modal-actions">

                <button
                    class="btn-secondary"
                    id="btn-cancelar-atividade"
                    type="button"
                >
                    Cancelar
                </button>


                <button
                    class="btn-primary"
                    type="submit"
                >
                    Criar atividade
                </button>

            </div>


        </form>

    </div>

</div>



<!-- =========================
     MODAL DETALHES
========================== -->

<div
    class="modal-backdrop"
    id="modal-detalhes-atividade"
    hidden
>

    <div class="modal">

        <button
            class="modal-close"
            id="btn-fechar-detalhes-atividade"
            type="button"
        >
            ×
        </button>


        <div id="activity-detail-content">

        </div>


        <div class="modal-actions">

            <button
                class="btn-secondary"
                id="btn-fechar-detalhes"
                type="button"
            >
                Fechar
            </button>

        </div>

    </div>

</div>



<div
    class="toast"
    id="toast"
></div>



<script src="../components/atividade.js"></script>

</body>

</html>
