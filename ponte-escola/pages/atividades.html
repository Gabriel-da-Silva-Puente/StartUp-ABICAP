<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PonteEscola — Atividades</title>

    <link rel="stylesheet" href="../components/global.css">
    <link rel="stylesheet" href="../components/layout.css">
    <link rel="stylesheet" href="../components/components.css">
    <link rel="stylesheet" href="../styles/atividades.css">

</head>

<body>

<div class="estrutura-app">

    <aside class="barra-lateral"></aside>

    <main class="conteudo-principal">

        <header class="barra-topo"></header>

        <section class="conteudo-pagina">

            <div class="cabecalho-pagina">
                <div>
                    <h2>Atividades</h2>
                    <p id="subtitulo-atividades-turma" class="subtitulo-pagina">
                        0 atividades · Carregando...
                    </p>
                </div>
                <button id="btn-nova-atividade" class="btn-principal" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    Nova Atividade
                </button>
            </div>

            <section class="grade-resumo" aria-label="Resumo das atividades">
                <div class="card-resumo verde">
                    <strong id="stat-total">0</strong>
                    <p>Total enviadas</p>
                </div>
                <div class="card-resumo laranja">
                    <strong id="stat-aguardando">0</strong>
                    <p>Aguardando leitura</p>
                </div>
                <div class="card-resumo azul">
                    <strong id="stat-confirmadas">0</strong>
                    <p>Confirmadas</p>
                </div>
            </section>

            <div class="barra-ferramentas">
                <div class="campo-pesquisa">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="search" id="busca-atividades" placeholder="Buscar atividade..." aria-label="Buscar atividade">
                </div>

                <div class="filtros-atividades" id="filtros-atividades" role="group" aria-label="Filtrar por situação">
                    <button type="button" data-filtro="todas" aria-pressed="true">Todas</button>
                    <button type="button" data-filtro="aguardando" aria-pressed="false">Aguardando</button>
                    <button type="button" data-filtro="confirmadas" aria-pressed="false">Confirmadas</button>
                </div>
            </div>

            <div class="lista-atividades" id="lista-atividades"></div>

        </section>

    </main>

</div>

<dialog id="modal-atividade" class="modal" aria-labelledby="modal-titulo">
    <form id="form-atividade" class="modal-form">
        <div class="modal-cabecalho">
            <h3 id="modal-titulo">Nova atividade</h3>
            <button type="button" class="modal-fechar" id="btn-fechar-modal" aria-label="Fechar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <label>Título
            <input type="text" name="titulo" required maxlength="80" placeholder="Ex.: Trazer avental na quinta">
        </label>

        <label>Descrição
            <textarea name="descricao" required rows="4" maxlength="400" placeholder="Explique o que os responsáveis precisam fazer"></textarea>
        </label>

        <label>Prazo
            <input type="date" name="prazo" required>
        </label>

        <div class="modal-acoes">
            <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar</button>
            <button type="submit" class="btn-principal">Publicar atividade</button>
        </div>
    </form>
</dialog>

<!--MUDEI: Adicionado o Modal de Detalhes -->
<dialog id="modal-detalhe-atividade" class="modal-detalhe">
    <div class="detalhe-header">
        <div class="detalhe-header-info">
            <span class="badge-tipo badge-comunicado" style="width: fit-content;">Atividade</span>
            <h2 id="detalhe-titulo">Título da Atividade</h2>
            <div class="detalhe-meta">
                <span>📅 Prazo: <span id="detalhe-prazo">Data</span></span>
                <span>👥 <span id="detalhe-leituras">0/0</span> leituras</span>
            </div>
        </div>
        <button type="button" class="modal-fechar" id="btn-fechar-detalhe" aria-label="Fechar">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <div class="detalhe-body">
        <p id="detalhe-descricao" style="font-size: 0.9375rem; line-height: 1.5; margin-bottom: 1rem; white-space: pre-wrap;">Descrição completa...</p>
        
        <div style="border-top: 1px solid #eee; padding-top: 1rem; margin-top: 1rem;">
            <h4 style="font-size: 0.875rem; color: var(--color-text); margin-bottom: 0.75rem;">Confirmações de leitura</h4>
            <div class="progresso-container">
                <div class="barra-fundo">
                    <div id="detalhe-barra" class="barra-preenchida" style="width: 0%;"></div>
                </div>
                <div id="detalhe-status-texto" class="progresso-texto">
                    0/0 <span>⏱</span>
                </div>
            </div>
        </div>
    </div>
</dialog>

<div class="aviso-flutuante" id="aviso-flutuante"></div>

<!--MUDEI -->
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../services/supabase.js"></script>

<!-- Services -->
<script src="../services/administradorService.js"></script>
<script src="../services/atividadeService.js"></script>

<!-- Componentes -->
<script src="../components/sidebar.js"></script>
<script src="../components/topbar.js"></script>

<!-- Script da Página -->
<script src="../scripts/atividades.js"></script>

<script>
    renderizarBarraLateral("atividades", "../");
    renderizarBarraTopo("../");
</script>
</body>
</html>
