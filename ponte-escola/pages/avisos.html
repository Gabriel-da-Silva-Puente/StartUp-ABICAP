<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PonteEscola — Avisos
    </title>

    <link
        rel="stylesheet"
        href="../components/global.css"
    >

    <link
        rel="stylesheet"
        href="../components/layout.css"
    >

</head>


<body>

<div class="app-shell">


    <!-- =========================
         MENU
    ========================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-mark">
                PE
            </div>

            <div>

                <strong>
                    PonteEscola
                </strong>

                <span>
                    Comunicação escolar
                </span>

            </div>

        </div>


        <nav
            class="main-nav"
            aria-label="Navegação principal"
        >

            <a
                class="nav-item"
                href="../index.html"
            >

                <span>⌂</span>

                Início

            </a>


            <a
                class="nav-item"
                href="./atividades.html"
            >

                <span>✓</span>

                Atividades

            </a>


            <a
                class="nav-item active"
                href="./avisos.html"
            >

                <span>➤</span>

                Avisos

            </a>


            <a
                class="nav-item"
                href="#"
            >

                <span>△</span>

                Ocorrências

            </a>


            <a
                class="nav-item"
                href="#"
            >

                <span>☑</span>

                Autorizações

            </a>


            <a
                class="nav-item"
                href="#"
            >

                <span>▣</span>

                Mural da Turma

            </a>

        </nav>


        <div class="sidebar-bottom">

            <button
                class="nav-item nav-button"
                id="profileBtn"
            >

                <span>♙</span>

                Perfil

            </button>


            <button
                class="nav-item nav-button"
                id="logoutBtn"
            >

                <span>↪</span>

                Sair

            </button>

        </div>

    </aside>


    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main class="main-content">


        <header class="topbar">

            <div>

                <p class="eyebrow">
                    Área do professor
                </p>

                <h1>
                    Ana Carolina Mendes
                </h1>

            </div>


            <div class="class-area">

                <button
                    class="class-selector"
                >

                    Jardim II — Turma A

                    <span>⌄</span>

                </button>


                <div class="class-meta">

                    ♧ 22 alunos

                </div>

            </div>

        </header>


        <section class="page-content">


            <!-- TÍTULO -->

            <div class="page-heading">

                <div>

                    <p class="eyebrow">
                        Comunicação
                    </p>

                    <h2>
                        Avisos
                    </h2>

                    <p class="page-subtitle">

                        Envie informações claras
                        e organizadas para os
                        responsáveis.

                    </p>

                </div>


                <button
                    class="primary-button"
                    id="btnNovoAviso"
                >

                    + Novo aviso

                </button>

            </div>


            <!-- FILTROS -->

            <div class="toolbar">

                <div
                    class="filter-tabs"
                    id="noticeFilters"
                >

                    <button
                        class="filter-tab active"
                        data-filter="todos"
                    >

                        Todos

                    </button>


                    <button
                        class="filter-tab"
                        data-filter="Aviso"
                    >

                        Avisos

                    </button>


                    <button
                        class="filter-tab"
                        data-filter="Comunicado"
                    >

                        Comunicados

                    </button>


                    <button
                        class="filter-tab"
                        data-filter="Evento"
                    >

                        Eventos

                    </button>


                    <button
                        class="filter-tab"
                        data-filter="Autorização"
                    >

                        Autorizações

                    </button>

                </div>


                <label class="search-box">

                    <span>⌕</span>

                    <input
                        id="inputBuscaAviso"
                        type="search"
                        placeholder="Buscar aviso..."
                    >

                </label>

            </div>


            <!-- LISTA -->

            <section
                class="panel notice-panel"
            >

                <div
                    class="notice-list"
                    id="noticeList"
                ></div>

            </section>

        </section>

    </main>

</div>


<!-- =========================
     MODAL NOVO AVISO
========================= -->

<div
    class="modal-backdrop"
    id="modalNovoAviso"
    hidden
>

    <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
    >

        <button
            class="modal-close"
            id="modalClose"
            aria-label="Fechar"
            type="button"
        >

            ×

        </button>


        <p class="eyebrow">
            Nova comunicação
        </p>


        <h2>
            Criar novo aviso
        </h2>


        <form
            id="formNovoAviso"
        >

            <label>

                Título

                <input
                    id="avisoTitulo"
                    required
                    maxlength="90"
                    placeholder="Digite o título do aviso"
                >

            </label>


            <label>

                Tipo

                <select
                    id="avisoTipo"
                    required
                >

                    <option value="">
                        Selecione
                    </option>

                    <option value="Aviso">
                        Aviso
                    </option>

                    <option value="Comunicado">
                        Comunicado
                    </option>

                    <option value="Evento">
                        Evento
                    </option>

                    <option value="Autorização">
                        Autorização
                    </option>

                </select>

            </label>


            <label>

                Mensagem

                <textarea
                    id="avisoMensagem"
                    required
                    maxlength="280"
                    rows="5"
                    placeholder="Digite o conteúdo do aviso..."
                ></textarea>

            </label>


            <div class="modal-actions">

                <button
                    type="button"
                    class="secondary-button"
                    id="modalCancel"
                >

                    Cancelar

                </button>


                <button
                    type="submit"
                    class="primary-button"
                >

                    Publicar aviso

                </button>

            </div>

        </form>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script src="../components/app.js"></script>
<script src="../components/avisos.js"></script>


</body>

</html>
