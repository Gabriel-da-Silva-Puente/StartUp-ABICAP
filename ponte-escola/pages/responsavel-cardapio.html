<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PonteEscola — Cardápio</title>

    <link rel="stylesheet" href="../components/global.css">
    <link rel="stylesheet" href="../components/layout.css">
    <link rel="stylesheet" href="../components/components.css">
    <link rel="stylesheet" href="../components/responsavel-layout.css">
    <link rel="stylesheet" href="../styles/responsavel-inicio.css">
    <link rel="stylesheet" href="../styles/responsavel-cardapio.css">
</head>

<body>

<div class="estrutura-responsavel">

    <header class="barra-topo-responsavel"></header>

    <main class="conteudo-responsavel">

        <section class="cabecalho-responsavel">
            <div>
                <p class="data-responsavel">Alimentação escolar</p>
                <h2>Cardápio</h2>
                <p class="subtitulo-pagina">Veja o que a escola vai servir ao longo da semana.</p>
            </div>

            <!-- Navegação entre semanas -->
            <div class="navegador-semana">
                <button type="button" class="btn-semana" id="btn-semana-anterior" aria-label="Semana anterior">
                    <img src="../assets/icons/chevron-right.svg" alt="" class="seta-anterior">
                </button>
                <button type="button" class="btn-semana-atual" id="btn-semana-atual">
                    <span id="texto-semana">Esta semana</span>
                    <small id="intervalo-semana"></small>
                </button>
                <button type="button" class="btn-semana" id="btn-semana-proxima" aria-label="Próxima semana">
                    <img src="../assets/icons/chevron-right.svg" alt="">
                </button>
            </div>
        </section>

        <!-- Destaque: cardápio de hoje (só aparece na semana atual) -->
        <section class="destaque-cardapio" id="destaque-cardapio" hidden></section>

        <section class="grade-cardapio" id="cardapio-semana"></section>

    </main>

</div>

<a class="botao-ajuda" href="responsavel-duvidas.html" aria-label="Central de dúvidas">?</a>

<div class="aviso-flutuante" id="aviso-flutuante"></div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!--  Arquivo que cria busca para o supabase 'banco'  -->
<script src="../services/supabase.js"></script>

<!-- Services  -->
<script src="../services/responsavelService.js"></script>
<script src="../services/cardapioService.js"></script>

<!-- Components  -->
<script src="../components/utilitarios.js"></script>
<script src="../components/responsavel-topbar.js"></script>

<!-- Script da Página -->
<script src="../scripts/cardapioResponsavel.js"></script>

<!-- Inicialização da página -->
<script>
    renderizarBarraTopoResponsavel("cardapio", "../");
</script>

</body>

</html>
