<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PonteEscola — Início</title>

    <link rel="stylesheet" href="../components/global.css">
    <link rel="stylesheet" href="../components/layout.css">
    <link rel="stylesheet" href="../components/components.css">
    <link rel="stylesheet" href="../styles/inicio.css">

</head>

<body>

<div class="estrutura-app">

    <aside class="barra-lateral"></aside>

    <main class="conteudo-principal">

        <header class="barra-topo"></header>

        <section class="conteudo-pagina">

            <div class="cabecalho-pagina">
                <div>
                    <h2 id="saudacao-inicio">Olá! 👋</h2>
                    <p id="subtitulo-inicio-data" class="subtitulo-pagina">
                        Acompanhe a comunicação e as atividades da sua turma em um só lugar.
                    </p>
                </div>
            </div>

            <section class="grade-estatisticas" aria-label="Resumo da turma">

                <a class="card-estatistica" href="avisos.html">
                    <div class="circulo-icone" id="circulo-avisos">
                    <img src="../assets/icons/megaphone.svg" alt="Avisos" class="icone-estatistica-avisos">
                    </div>
                    <div>
                        <span>Avisos ativos</span>
                        <strong id="stat-avisos">0</strong>
                    </div>
                </a>

                <a class="card-estatistica" href="autorizacoes.html">
                    <div class="circulo-icone">
                        <img src="../assets/icons/clock.svg" alt="Pendencias" class="icone-estatistica-pendencias">
                    </div>
                    <div>
                        <span>Pendências</span>
                        <strong id="stat-pendencias">0</strong>
                    </div>
                </a>

                <a class="card-estatistica" href="ocorrencias.html">
                    <div class="circulo-icone">
                    <img src="../assets/icons/triangle-alert.svg" alt="Ocorrencias" class="icone-estatistica-ocorrencias">
                    </div>
                    <div>
                        <span>Ocorrências</span>
                        <strong id="stat-ocorrencias">0</strong>
                    </div>
                </a>

                <a class="card-estatistica" href="atividades.html">
                    <div class="circulo-icone">
                    <img src="../assets/icons/clipboard-list.svg" alt="Atividades" class="icone-estatistica-atividades">
                    </div>
                    <div>
                        <span>Atividades</span>
                        <strong id="stat-atividades">0</strong>
                    </div>
                </a>

            </section>

            <section class="grade-home">

                <article class="painel painel-grande">
                    <div class="cabecalho-painel">
                        <div>
                            <p class="sobrescrito">Comunicação</p>
                            <h3>Últimos avisos</h3>
                        </div>
                        <a href="avisos.html">Ver todos</a>
                    </div>
                    <div id="lista-avisos-home" class="lista-previa-avisos"></div>
                </article>

            </section>

        </section>

    </main>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!--  Arquivo que cria busca para o supabase 'banco'  -->
<script src="../services/supabase.js"></script>

<!-- Services  -->
<script src="../services/administradorService.js"></script>
<script src="../services/atividadeService.js"></script>

<!-- Componentes -->
<script src="../components/sidebar.js"></script>
<script src="../components/topbar.js"></script>

<!-- Inicialização da página -->
<script src="../scripts/inicio.js"></script>
<script>
    renderizarBarraLateral("inicio", "../");
    renderizarBarraTopo("../");
    document.getElementById('stat-atividades').textContent = AtividadeService.listar().length;
</script>

</body>

</html>
