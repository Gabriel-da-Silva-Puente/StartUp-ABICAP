<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PonteEscola - Início</title>

    <link rel="stylesheet" href="../components/global.css">
    <link rel="stylesheet" href="../components/layout.css">
    <link rel="stylesheet" href="../components/pglinicial.css">
</head>

<body>

    <div class="app">

        <!-- =========================
             SIDEBAR
        ========================== -->
        <aside class="sidebar">

            <div class="logo-area">
                <div class="logo-icon">P</div>

                <div class="logo-text">
                    <strong>PonteEscola</strong>
                    <span>Gestão escolar</span>
                </div>
            </div>

            <nav class="sidebar-nav">

                <button class="nav-item active" type="button" data-section="inicio">
                    <span class="nav-icon">⌂</span>
                    <span>Início</span>
                </button>

                <button class="nav-item" type="button" data-section="atividades">
                    <span class="nav-icon">✓</span>
                    <span>Atividades</span>
                </button>

                <button class="nav-item" type="button" data-section="avisos">
                    <span class="nav-icon">🔔</span>
                    <span>Avisos</span>
                </button>

                <button class="nav-item" type="button" data-section="ocorrencias">
                    <span class="nav-icon">⚠</span>
                    <span>Ocorrências</span>
                </button>

                <button class="nav-item" type="button" data-section="autorizacoes">
                    <span class="nav-icon">▣</span>
                    <span>Autorizações</span>
                </button>

                <button class="nav-item" type="button" data-section="mural">
                    <span class="nav-icon">▤</span>
                    <span>Mural</span>
                </button>

            </nav>

            <div class="sidebar-bottom">

                <button class="nav-item" id="profileBtn" type="button">
                    <span class="nav-icon">👤</span>
                    <span>Meu perfil</span>
                </button>

                <button class="nav-item logout" id="logoutBtn" type="button">
                    <span class="nav-icon">↪</span>
                    <span>Sair</span>
                </button>

            </div>

        </aside>


        <!-- =========================
             CONTEÚDO PRINCIPAL
        ========================== -->
        <main class="main-content">

            <!-- TOPBAR -->
            <header class="topbar">

                <div class="topbar-left">

                    <div class="breadcrumb">
                        <span>Início</span>
                        <span>/</span>
                        <strong id="headingClass">6º Ano A</strong>
                    </div>

                    <h1>Olá, responsável! 👋</h1>

                    <p id="sectionSubtitle">
                        Acompanhe a vida escolar do seu filho.
                    </p>

                </div>


                <div class="topbar-right">

                    <!-- Seletor de turma -->
                    <div class="class-selector-wrapper">

                        <button
                            class="class-selector"
                            id="classSelector"
                            type="button"
                            aria-expanded="false"
                        >
                            <span>Turma:</span>
                            <strong id="classLabel">6º Ano A</strong>
                            <span class="arrow">⌄</span>
                        </button>

                        <div class="class-menu" id="classMenu" hidden>

                            <button type="button" data-class="6º Ano A">
                                6º Ano A
                            </button>

                            <button type="button" data-class="6º Ano B">
                                6º Ano B
                            </button>

                            <button type="button" data-class="7º Ano A">
                                7º Ano A
                            </button>

                        </div>

                    </div>


                    <!-- Notificação -->
                    <button
                        class="icon-button"
                        id="notificationBtn"
                        type="button"
                        aria-label="Notificações"
                    >
                        🔔
                        <span class="notification-dot"></span>
                    </button>


                    <!-- Avatar -->
                    <button
                        class="avatar-button"
                        id="avatarBtn"
                        type="button"
                        aria-label="Perfil"
                    >
                        <span>MR</span>
                    </button>

                </div>

            </header>


            <!-- =========================
                 ÁREA DA PÁGINA
            ========================== -->
            <div class="page-content">

                <!-- =========================
                     CARDS DE RESUMO
                ========================== -->

                <section
                    class="stats-grid"
                    aria-label="Resumo da turma"
                >

                    <button
                        class="stat-card blue"
                        data-filter="avisos"
                        type="button"
                    >
                        <div class="stat-card-top">
                            <span class="stat-icon">🔔</span>
                            <span class="stat-arrow">→</span>
                        </div>

                        <strong class="stat-number">4</strong>

                        <span class="stat-label">
                            Novos avisos
                        </span>
                    </button>


                    <button
                        class="stat-card orange"
                        data-filter="pendencias"
                        type="button"
                    >
                        <div class="stat-card-top">
                            <span class="stat-icon">!</span>
                            <span class="stat-arrow">→</span>
                        </div>

                        <strong class="stat-number">2</strong>

                        <span class="stat-label">
                            Pendências
                        </span>
                    </button>


                    <button
                        class="stat-card red"
                        data-filter="ocorrencias"
                        type="button"
                    >
                        <div class="stat-card-top">
                            <span class="stat-icon">⚠</span>
                            <span class="stat-arrow">→</span>
                        </div>

                        <strong class="stat-number">1</strong>

                        <span class="stat-label">
                            Ocorrências
                        </span>
                    </button>


                    <button
                        class="stat-card green"
                        data-filter="atividades"
                        type="button"
                    >
                        <div class="stat-card-top">
                            <span class="stat-icon">✓</span>
                            <span class="stat-arrow">→</span>
                        </div>

                        <strong class="stat-number">8</strong>

                        <span class="stat-label">
                            Atividades
                        </span>
                    </button>

                </section>


                <!-- =========================
                     AVISOS RECENTES
                ========================== -->

                <section class="content-section">

                    <div class="section-header">

                        <div>
                            <h2>Avisos recentes</h2>

                            <p>
                                Fique por dentro das novidades da escola.
                            </p>
                        </div>

                        <button
                            class="view-all-button"
                            id="viewAllBtn"
                            type="button"
                        >
                            Ver todos →
                        </button>

                    </div>


                    <div class="notice-list">

                        <button
                            class="notice-row"
                            type="button"
                            data-title="Reunião de pais e responsáveis"
                        >
                            <div class="notice-icon blue-icon">
                                🔔
                            </div>

                            <div class="notice-content">
                                <strong>
                                    Reunião de pais e responsáveis
                                </strong>

                                <span>
                                    A reunião acontecerá na próxima semana.
                                </span>
                            </div>

                            <span class="notice-date">
                                Hoje
                            </span>
                        </button>


                        <button
                            class="notice-row"
                            type="button"
                            data-title="Entrega das atividades de matemática"
                        >
                            <div class="notice-icon orange-icon">
                                ✓
                            </div>

                            <div class="notice-content">
                                <strong>
                                    Entrega das atividades de matemática
                                </strong>

                                <span>
                                    Confira o prazo de entrega das atividades.
                                </span>
                            </div>

                            <span class="notice-date">
                                Ontem
                            </span>
                        </button>


                        <button
                            class="notice-row"
                            type="button"
                            data-title="Passeio escolar"
                        >
                            <div class="notice-icon green-icon">
                                📅
                            </div>

                            <div class="notice-content">
                                <strong>
                                    Passeio escolar
                                </strong>

                                <span>
                                    Consulte as informações sobre o passeio.
                                </span>
                            </div>

                            <span class="notice-date">
                                2 dias
                            </span>
                        </button>


                        <button
                            class="notice-row"
                            type="button"
                            data-title="Atualização do calendário escolar"
                        >
                            <div class="notice-icon purple-icon">
                                📚
                            </div>

                            <div class="notice-content">
                                <strong>
                                    Atualização do calendário escolar
                                </strong>

                                <span>
                                    O calendário escolar recebeu novas datas.
                                </span>
                            </div>

                            <span class="notice-date">
                                3 dias
                            </span>
                        </button>

                    </div>

                </section>


                <!-- =========================
                     ATALHOS
                ========================== -->

                <section class="quick-section">

                    <div class="section-header">

                        <div>
                            <h2>Acesso rápido</h2>

                            <p>
                                Acesse os principais recursos.
                            </p>
                        </div>

                    </div>


                    <div class="quick-grid">

                        <button
                            class="quick-card"
                            type="button"
                            data-section="atividades"
                        >
                            <span class="quick-icon">✓</span>

                            <div>
                                <strong>Atividades</strong>
                                <span>Veja as atividades escolares.</span>
                            </div>
                        </button>


                        <button
                            class="quick-card"
                            type="button"
                            data-section="avisos"
                        >
                            <span class="quick-icon">🔔</span>

                            <div>
                                <strong>Avisos</strong>
                                <span>Consulte os comunicados.</span>
                            </div>
                        </button>


                        <button
                            class="quick-card"
                            type="button"
                            data-section="ocorrencias"
                        >
                            <span class="quick-icon">⚠</span>

                            <div>
                                <strong>Ocorrências</strong>
                                <span>Acompanhe as ocorrências.</span>
                            </div>
                        </button>

                    </div>

                </section>

            </div>

        </main>

    </div>


    <!-- =========================
         MODAL
    ========================== -->

    <div
        class="modal-backdrop"
        id="modalBackdrop"
        hidden
    >

        <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
        >

            <button
                class="modal-close"
                id="modalClose"
                type="button"
                aria-label="Fechar"
            >
                ×
            </button>

            <h2 id="modalTitle">
                Aviso
            </h2>

            <p id="modalText"></p>

            <div
                class="modal-actions"
                id="modalActions"
            >
                <button
                    class="primary-button"
                    id="modalOk"
                    type="button"
                >
                    Fechar
                </button>
            </div>

        </div>

    </div>


    <!-- =========================
         TOAST
    ========================== -->

    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    ></div>


    <script src="../components/pginicial.js"></script>

</body>
</html>
